<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Background Icon Shape -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Inner Circle Disc -->
  <circle cx="256" cy="256" r="165" fill="url(#circleGrad)" stroke="#ffffff" stroke-width="12" filter="url(#shadow)"/>

  <!-- Circumference dashed helper -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="14 10"/>

  <!-- Diameter (Blue line) -->
  <line x1="91" y1="256" x2="421" y2="256" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Radius (Orange line) -->
  <line x1="256" y1="256" x2="373" y2="139" stroke="#ea580c" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Chord (Purple line) -->
  <line x1="139" y1="139" x2="373" y2="373" stroke="#9333ea" stroke-width="7" stroke-linecap="round"/>

  <!-- Center point (Red circle) -->
  <circle cx="256" cy="256" r="18" fill="#e11d48" stroke="#ffffff" stroke-width="5" />
  
  <!-- Radius end point -->
  <circle cx="373" cy="139" r="12" fill="#ea580c" stroke="#ffffff" stroke-width="4" />
</svg>
